name: marketplace

on:
  workflow_dispatch:
    inputs:
      version:
        description: "plugin.json version to release (empty = bump patch)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: marketplace
  cancel-in-progress: false

env:
  LLVM_ROOT: C:/Program Files/LLVM

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          MIN_BN: ${{ vars.MIN_BN || '5.2' }}
        run: bash .github/scripts/plan.sh minors

  build:
    needs: plan
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        entry: ${{ fromJSON(needs.plan.outputs.matrix) }}
        runner: [windows-latest, ubuntu-latest, macos-latest]
    name: build (BN ${{ matrix.entry.label }}, ${{ matrix.runner }})
    steps:
      - uses: actions/checkout@v4
      - id: build
        uses: ./.github/actions/build
        with:
          ref: ${{ matrix.entry.ref }}
          label: ${{ matrix.entry.label }}
      - uses: actions/upload-artifact@v4
        with:
          name: mm-${{ matrix.entry.mm }}-${{ matrix.runner }}
          path: ${{ steps.build.outputs.library }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: zip-${{ matrix.entry.mm }}-${{ matrix.runner }}
          path: ${{ steps.build.outputs.zip }}
          if-no-files-found: error

  release:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stage binaries and bump version
        id: ver
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          rm -rf bin
          for mm in $(jq -r '.[].mm' <<<"$MATRIX"); do
            mkdir -p "bin/$mm"
            cp artifacts/mm-$mm-*/binja_wasm.* "bin/$mm/"
          done
          cur=$(jq -r .version plugin.json)
          new=${INPUT_VERSION:-$(awk -F. '{printf "%d.%d.%d", $1, $2, $3+1}' <<<"$cur")}
          jq --arg v "$new" '.version = $v' plugin.json > plugin.json.tmp && mv plugin.json.tmp plugin.json
          echo "version=$new" >> "$GITHUB_OUTPUT"
      - name: Commit, tag and release
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f bin plugin.json
          git commit -m "Release $VERSION"
          git tag "v$VERSION"
          git push origin HEAD "v$VERSION"
          gh release create "v$VERSION" artifacts/zip-*/*.zip --title "v$VERSION" --generate-notes
