name: build

on:
  push:
    branches: [main, master]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  LLVM_ROOT: C:/Program Files/LLVM

jobs:
  plan:
    if: github.event_name != 'push' || startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          MIN_BN: ${{ vars.MIN_BN || '5.2' }}
        run: bash .github/scripts/plan.sh release

  build:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.plan.outputs.matrix) }}
        runner: [windows-latest, ubuntu-latest, macos-latest]
    name: build (BN ${{ matrix.entry.label }}, ${{ matrix.runner }})
    steps:
      - uses: actions/checkout@v4
      - id: build
        uses: ./.github/actions/build
        with:
          ref: ${{ matrix.entry.ref }}
          label: ${{ matrix.entry.label }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.entry.tag }}-${{ matrix.entry.label }}-${{ matrix.runner }}
          path: ${{ steps.build.outputs.zip }}
          if-no-files-found: error

  release:
    needs: [plan, build]
    if: always() && needs.plan.result == 'success' && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Publish
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          jq -c '.[]' <<<"$MATRIX" | while read -r e; do
            label=$(jq -r .label <<<"$e"); tag=$(jq -r .tag <<<"$e"); kind=$(jq -r .kind <<<"$e"); ref=$(jq -r .ref <<<"$e")
            zips=(out/$tag-$label-*/binja_wasm-bn$label-*.zip)
            [ -f "${zips[0]}" ] && [ "${#zips[@]}" -eq 3 ] || { echo "skip $label: not all platforms built"; continue; }
            if [ "$kind" = dev ]; then
              gh release delete "$tag" --cleanup-tag -y || true
              gh release create "$tag" "${zips[@]}" --prerelease --title "Binary Ninja dev (${ref:0:7})" \
                --notes "Built against binaryninja-api dev @ $ref"
            else
              gh release create "$tag" "${zips[@]}" --title "Binary Ninja $label" \
                --notes "Built against binaryninja-api tag stable/$label"
            fi
          done
