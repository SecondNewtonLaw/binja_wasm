name: build-plugin
description: Build and test binja_wasm against one binaryninja-api ref and zip the plugin library.
inputs:
  ref:
    description: binaryninja-api tag or commit
    required: true
  label:
    description: Version label used in cache keys and the zip name
    required: true
outputs:
  zip:
    description: Name of the produced zip
    value: ${{ steps.package.outputs.zip }}
  library:
    description: Path of the built plugin library
    value: ${{ steps.package.outputs.library }}
runs:
  using: composite
  steps:
    - name: Prepare environment
      shell: bash
      run: |
        case "$RUNNER_OS" in
          Windows) preset=release;       os=win64; cpm=C:/cpm;                 cc=C:/ccache ;;
          Linux)   preset=linux-release; os=linux; cpm="$HOME/.cache/cpm";     cc="$HOME/.cache/ccache" ;;
          macOS)   preset=macos-release; os=macos; cpm="$HOME/.cache/cpm";     cc="$HOME/.cache/ccache" ;;
        esac
        {
          echo "BW_PRESET=$preset"
          echo "BW_OS=$os"
          echo "CPM_SOURCE_CACHE=$cpm"
          echo "CCACHE_DIR=$cc"
        } >> "$GITHUB_ENV"
    - name: Windows toolchain
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        git config --system core.longpaths true
        choco install ccache -y --no-progress
    - uses: ilammy/msvc-dev-cmd@v1
      if: runner.os == 'Windows'
    - name: Linux toolchain
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y ccache ninja-build
    - name: macOS toolchain
      if: runner.os == 'macOS'
      shell: bash
      run: brew install ccache ninja
    - uses: actions/cache/restore@v4
      with:
        path: ${{ env.CPM_SOURCE_CACHE }}
        key: cpm-${{ env.BW_OS }}-${{ inputs.ref }}-${{ hashFiles('CMakeLists.txt', 'cmake/CPM.cmake') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          cpm-${{ env.BW_OS }}-${{ inputs.ref }}-${{ hashFiles('CMakeLists.txt', 'cmake/CPM.cmake') }}-
          cpm-${{ env.BW_OS }}-${{ inputs.ref }}-
    - uses: actions/cache/restore@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ env.BW_OS }}-${{ inputs.label }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ccache-${{ env.BW_OS }}-${{ inputs.label }}-
          ccache-${{ env.BW_OS }}-
    - name: Configure
      shell: bash
      run: >
        cmake --preset "$BW_PRESET"
        -DBN_INSTALL_DIR=
        -DBN_ALLOW_STUBS=ON
        -DBN_API_REVISION="${{ inputs.ref }}"
        -DBN_USER_PLUGINS_DIR="${{ runner.temp }}/plugins"
    - name: Build
      shell: bash
      run: cmake --build --preset "$BW_PRESET"
    - name: Compiler cache statistics
      if: always()
      shell: bash
      run: ccache --show-stats
    - name: Save CPM sources
      if: always()
      uses: actions/cache/save@v4
      with:
        path: ${{ env.CPM_SOURCE_CACHE }}
        key: cpm-${{ env.BW_OS }}-${{ inputs.ref }}-${{ hashFiles('CMakeLists.txt', 'cmake/CPM.cmake') }}-${{ github.run_id }}-${{ github.run_attempt }}
    - name: Save compiler cache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ env.BW_OS }}-${{ inputs.label }}-${{ github.run_id }}-${{ github.run_attempt }}
    - name: Test
      shell: bash
      run: ctest --test-dir "cmake-build-$BW_PRESET" --output-on-failure
    - name: Package
      id: package
      shell: bash
      run: |
        lib=$(ls cmake-build-$BW_PRESET/binja_wasm.{dll,so,dylib} 2>/dev/null | head -1)
        zip="binja_wasm-bn${{ inputs.label }}-$BW_OS.zip"
        (cd "$(dirname "$lib")" && cmake -E tar cf "$GITHUB_WORKSPACE/$zip" --format=zip "$(basename "$lib")")
        echo "zip=$zip" >> "$GITHUB_OUTPUT"
        echo "library=$lib" >> "$GITHUB_OUTPUT"
